[project]
name = "aither-backend"
version = "1.0.0"
description = "Central API backend for Aither Tech applications."
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115,<1.0",
    "pydantic-settings>=2.0,<3.0",
    "resend>=2.0,<3.0",
    "firebase-admin>=6.9,<7.0",
]

[tool.fastapi]
entrypoint = "app.main:app"
